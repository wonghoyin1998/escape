services:
  - type: web
    name: escape-room-police-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYSTEM_PASSWORD
        value: "130"
      - key: ADMIN_PASSWORD
        value: "1357924680"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: escape-room-police-db
          property: connectionString

databases:
  - name: escape-room-police-db
    plan: free
    databaseName: police_system
    user: police_system
